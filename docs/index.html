<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1E1E1E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Morning Brief">
<title>Morning Brief</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">

  <div class="header">
    <div class="onair"><span class="onair-dot"></span>ON AIR</div>
    <h1>Morning Brief</h1>
    <div class="date" id="date">読み込み中...</div>
    <div><span class="theme-badge" id="themeBadge"></span></div>
  </div>

  <div id="notice"></div>

  <div class="player-section">
    <audio controls preload="metadata" id="player" src="podcast.mp3"></audio>
  </div>

  <div class="lineup">
    <span class="label">今日の構成</span>
    <span class="segment" id="segment">—</span>
  </div>

  <div id="market"></div>

  <div class="section-title">Portfolio</div>
  <div class="graph-card" id="graphCard">
    <canvas id="graph"></canvas>
    <div class="graph-info" id="graphInfo">ノードをタップすると詳細を表示します</div>
  </div>
  <div id="summary"></div>
  <div id="holdings"><div class="fund-note">読み込み中...</div></div>

  <div id="scriptBox"></div>
  <div id="archive"></div>

  <a class="btn" href="settings.html">Portfolio設定</a>

  <div class="footer">
    <div class="updated" id="updated"></div>
    <div class="disclaimer">※投資判断はご自身の責任で行ってください</div>
  </div>

</div>
<script src="app.js"></script>
</body>
</html>
